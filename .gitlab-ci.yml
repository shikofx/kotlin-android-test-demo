default:
  image: $CI_REGISTRY_IMAGE/android-builder:latest
  tags:
    - docker

variables:
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle

cache:
  - key:
      files:
        - build.gradle
    paths:
      - $GRADLE_USER_HOME/caches/modules-2
      - $GRADLE_USER_HOME/caches/jars-9
    policy: pull
  - key: "gradle-build-cache-${CI_COMMIT_REF_SLUG}"
    paths:
      - $GRADLE_USER_HOME/caches/build-cache-8
    policy: pull-push

stages:
  - .pre
  - analyse
  - module_tests
  - build
  - integration_tests
  - system_tests
  - performance_tests
  - report
  - publish
  - deploy

prepare_dependencies:
  stage: .pre
  script:
    - ./gradlew androidDependencies
  cache:
    - key:
        files:
          - build.gradle
      paths:
        - $GRADLE_USER_HOME/caches/modules-2
        - $GRADLE_USER_HOME/caches/jars-9
      policy: push
    - key: "gradle-build-cache-${CI_COMMIT_REF_SLUG}"
      paths:
        - $GRADLE_USER_HOME/caches/build-cache-8
      policy: push

pmd:
  stage: analyse
  script:
    - ./gradlew app:pmdDebug
  artifacts:
    when: always
    paths:
      - app/build/reports/pmd/debug.html
    expire_in: 1 day

checkstyle:
  stage: analyse
  script:
    - ./gradlew app:checkstyleDebug
  artifacts:
    when: always
    paths:
      - app/build/reports/checkstyle/debug.html
    expire_in: 1 day

android_lint:
  stage: analyse
  script:
    - ./gradlew app:lintDebug
  artifacts:
    when: always
    paths:
      - app/build/reports/lint-results-debug.html
    expire_in: 1 day

unit_tests:
  stage: module_tests
  script:
    - ./gradlew testDebugUnitTest -Djunit.jupiter.tags.include=unit -Djunit.jupiter.tags.exclude=database
  artifacts:
    when: always
    paths:
      - app/build/allure-results/
      - app/build/reports/tests/testDebugUnitTest/
    expire_in: 1 day

ui_module_tests:
  stage: module_tests
  script: "echo 'Module tests...'"

build:
  stage: build
  needs: ["unit_tests"]
  script:
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/
    expire_in: 7 days

ui_integration_tests:
  stage: integration_tests
  needs: ["build"]
  script:
    - ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.tags=integration-ui
  artifacts:
    when: always
    paths:
      - app/build/allure-results/
      - app/build/reports/androidTests/connected/
    expire_in: 1 day

ui_component_tests:
  stage: integration_tests
  needs: ["build"]
  script:
    - ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.tags=component-ui
  artifacts:
    when: always
    paths:
      - app/build/allure-results/
      - app/build/reports/androidTests/connected/
    expire_in: 1 day

db_integration_tests:
  stage: integration_tests
  needs: ["build"]
  script:
    - ./gradlew testDebugUnitTest -Djunit.jupiter.tags.include=database
  artifacts:
    when: always
    paths:
      - app/build/allure-results/
      - app/build/reports/tests/testDebugUnitTest/
    expire_in: 1 day

snapshot_tests:
  stage: integration_tests
  needs: ["build"]
  script: "echo 'Snapshot tests...'"

instrumental_tests:
  stage: system_tests
  script: "echo 'Instrumental tests...'"

ui_e2e_tests:
  stage: system_tests
  script: "echo 'System tests...'"

pages:
  stage: publish
  rules:
    # - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - job: pmd
      artifacts: true
    - job: checkstyle
      artifacts: true
    - job: android_lint
      artifacts: true
    - job: unit_tests
      artifacts: true
    - job: db_integration_tests
      artifacts: true
    - job: ui_component_tests
      artifacts: true
  when: always
  script:
    # 1. Install Allure Commandline
    - apt-get update && apt-get install -y wget
    - wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
    - tar -zxvf allure-2.29.0.tgz
    - ln -s $(pwd)/allure-2.29.0/bin/allure /usr/local/bin/allure
    - allure --version

    - echo "Assembling reports for GitLab Pages..."
    - mkdir -p public public/checkstyle public/pmd public/lint public/unit-tests public/db-integration-tests public/ui-component-tests public/allure-report

    - cp -r app/build/reports/checkstyle/* public/checkstyle/ || echo "Checkstyle report not found"
    - cp -r app/build/reports/pmd/* public/pmd/ || echo "PMD report not found"
    - cp app/build/reports/lint-results-debug.html public/lint/index.html || echo "Lint report not found"
    - |
      if [ -d "app/build/reports/tests/testDebugUnitTest" ]; then
        cp -r app/build/reports/tests/testDebugUnitTest/* public/unit-tests/
        cp -r app/build/reports/tests/testDebugUnitTest/* public/db-integration-tests/
      fi
    - cp -r app/build/reports/androidTests/connected/* public/ui-component-tests/ || echo "UI Component Test report not found"

    # 2. Generate Allure report
    - |
      if [ -d "app/build/allure-results" ]; then
        allure generate app/build/allure-results -o public/allure-report --clean
      else
        echo "Allure results not found, skipping report generation."
      fi

    # Create main index.html with links to reports
    - |
      echo "<html><head><title>Build Reports</title></head><body><h1>Build Reports</h1><ul>" > public/index.html
      echo '<li><a href="allure-report/index.html">Allure Report</a></li>' >> public/index.html
      echo '<li><a href="checkstyle/debug.html">Checkstyle Report</a></li>' >> public/index.html
      echo '<li><a href="pmd/debug.html">PMD Report</a></li>' >> public/index.html
      echo '<li><a href="lint/index.html">Android Lint Report</a></li>' >> public/index.html
      echo '<li><a href="unit-tests/index.html">Unit Tests Report</a></li>' >> public/index.html
      echo '<li><a href="db-integration-tests/index.html">DB Integration Tests Report</a></li>' >> public/index.html
      echo '<li><a href="ui-component-tests/index.html">UI Component Tests Report</a></li>' >> public/index.html
      echo "</ul></body></html>" >> public/index.html
  artifacts:
    paths:
      - public

deploy:
  stage: deploy
  needs: ["pages"]
  when: manual
  script: "echo 'Deploy...'"