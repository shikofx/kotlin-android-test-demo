import org.apache.tools.ant.taskdefs.condition.Os

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'io.qameta.allure'
apply plugin: "de.mannodermaus.android-junit5"

android {
    namespace 'by.pda.demoapp.android'

    signingConfigs {}

    compileSdkVersion 36
    useLibrary 'org.apache.http.legacy'
    ndkVersion '21.3.6528147'

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1 // CI automatically replaces this
        versionName "1.0.0" // CI automatically replaces this
        multiDexEnabled true

        testInstrumentationRunner "by.pda.demoapp.DemoTestRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'

        testInstrumentationRunnerArgument 'de.mannodermaus.junit5.logevents', 'true'

        if (project.hasProperty('includeTags')) {
            testInstrumentationRunnerArgument 'de.mannodermaus.junit5.includeTags', project.property('includeTags')
        }

        if (project.hasProperty('excludeTags')) {
            testInstrumentationRunnerArgument 'de.mannodermaus.junit5.excludeTags', project.property('excludeTags')
        }

        buildConfigField "String", "SAUCE_USERNAME", "\"${System.getenv('SAUCE_USERNAME')}\""
        buildConfigField "String", "SAUCE_ACCESS_KEY", "\"${System.getenv('SAUCE_ACCESS_KEY')}\""
    }

    testOptions {
        animationsDisabled true

        unitTests {
            includeAndroidResources true
        }

        unitTests.all {
            useJUnitPlatform()
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Suppress specific lint warnings to prevent build failures in CI
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs += ["-Xlint:unchecked", "-Xlint:deprecation"]
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }

    dataBinding {
        enabled = true
    }


    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/aop-ajc.xml'
            excludes += '/META-INF/CHANGES'
            excludes += '/META-INF/README.md'
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}
// The 'flatDir' repository is not recommended. It's better to find modern alternatives for local .aar files in public repositories.

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    //Libraries For Testing
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'

    // Google's Truth
    testImplementation 'com.google.truth:truth:1.3.0'
    androidTestImplementation 'com.google.truth:truth:1.3.0'

    // Allure
    testImplementation 'io.qameta.allure:allure-junit5:2.25.0'
    androidTestImplementation 'io.qameta.allure:allure-junit5:2.25.0'

    // Mockito for Java tests
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'

    // JUnit 5 for Android Tests (androidTest)
    androidTestRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.0'
    androidTestImplementation "org.junit.jupiter:junit-jupiter-api:5.14.0"
    androidTestImplementation 'org.junit.jupiter:junit-jupiter-params:5.14.0'
    // JUnit 5 for Unit Tests (test)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.14.0'

    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"
    debugImplementation "androidx.fragment:fragment-testing:1.7.1"
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'
    androidTestImplementation("androidx.test.espresso:espresso-contrib:3.5.0")
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.5.0"

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.biometric:biometric:1.1.0"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.gms:play-services-location:18.0.0'
    implementation 'com.google.android.material:material:1.4.0'

    def lifecycle_version = "2.6.2"
    // ViewModel and LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"

    def room_version = "2.4.2"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"

    //Retrofit
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.guava:guava:33.0.0-android'

    // Utils
    implementation 'com.github.gcacace:signature-pad:1.3.1'
    implementation(name:'com.kyanogen.signatureview.signature-view', ext:'aar')
    implementation(name:'com.williamww.silky-signature', ext:'aar')
    implementation(name:'com.uphyca.creditcardedittext', ext:'aar')

    implementation 'com.github.GrenderG:Toasty:1.4.2'
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Backtrace SDK
    implementation 'com.github.backtrace-labs.backtrace-android:backtrace-library:3.7.0'

    def camerax_version = "1.1.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "com.google.zxing:core:3.3.3"


}

configurations {
    androidTestImplementation {
        // Exclude log4j as it uses APIs not available on older Android versions (< 26)
        exclude group: 'org.apache.logging.log4j'
    }
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

apply from: "$project.rootDir/gradle/pmd.gradle"
apply from: "$project.rootDir/gradle/checkstyle.gradle"
apply from: "$project.rootDir/gradle/lint.gradle"

allure {
    version = "2.29.0"
}

// Define custom test tasks for better CI/CD integration and local execution

tasks.register('unitTests', Test) {
    group = 'verification'
    description = 'Runs all local unit tests (tagged with "unit").'
    useJUnitPlatform {
        includeTags 'unitTests'
    }
    testClassesDirs = tasks.named('testDebugUnitTest').get().testClassesDirs
    classpath = tasks.named('testDebugUnitTest').get().classpath
}

tasks.register('databaseTests', Exec) {
    group = 'verification'
    description = 'Runs integration database tests on connected devices.'
    workingDir = rootDir
    dependsOn 'assembleDebug', 'assembleDebugAndroidTest'
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        commandLine 'cmd', '/c', 'gradlew.bat', 'connectedDebugAndroidTest', '-PincludeTags=databaseTests'
    } else {
        commandLine './gradlew', 'connectedDebugAndroidTest', '-PincludeTags=databaseTests'
    }
}

junitPlatform {
    instrumentationTests.includeExtensions.set(true)
}

tasks.register('componentUiTests', Exec) {
    group = 'verification'
    description = 'Runs component UI tests on connected devices.'
    workingDir = rootDir
    dependsOn 'assembleDebug', 'assembleDebugAndroidTest'
    commandLine './gradlew', 'connectedDebugAndroidTest', '-PincludeTags=componentUiTests'
}

tasks.register('integrationUiTests', Exec) {
    group = 'verification'
    description = 'Runs integration UI tests on connected devices.'
    workingDir = rootDir
    dependsOn 'assembleDebug', 'assembleDebugAndroidTest'
    commandLine './gradlew', 'connectedDebugAndroidTest', '-PincludeTags=integrationUiTests'
}
