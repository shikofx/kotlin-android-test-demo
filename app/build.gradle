plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'io.qameta.allure'
    id "de.mannodermaus.android-junit5"
}

android {
    namespace 'by.pda.demoapp.android'

    signingConfigs {}

    compileSdkVersion 34
    useLibrary 'org.apache.http.legacy'
    ndkVersion '21.3.6528147'

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1 // CI automatically replaces this
        versionName "1.0.0" // CI automatically replaces this
        multiDexEnabled true

        testInstrumentationRunner "by.pda.demoapp.IntegrationTestRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'

        buildConfigField "String", "SAUCE_USERNAME", "\"${System.getenv('SAUCE_USERNAME')}\""
        buildConfigField "String", "SAUCE_ACCESS_KEY", "\"${System.getenv('SAUCE_ACCESS_KEY')}\""
    }

    testOptions {
        animationsDisabled true

        unitTests {
            includeAndroidResources true
        }

        unitTests.all {
            useJUnitPlatform()
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        // Suppress specific lint warnings to prevent build failures in CI
        freeCompilerArgs += ["-Xlint:unchecked", "-Xlint:deprecation"]
    }

    buildFeatures {
        buildConfig true
    }

    dataBinding {
        enabled = true
    }


    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/aop-ajc.xml'
            excludes += '/META-INF/CHANGES'
            excludes += '/META-INF/README.md'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX & Material
    implementation(libs.appcompat)
    implementation(libs.constraintlayout)
    implementation(libs.cardview)
    implementation(libs.recyclerview)
    implementation(libs.multidex)
    implementation(libs.biometric)
    implementation(libs.legacy.support.v4)
    implementation(libs.material)
    implementation(libs.play.services.location)

    // Lifecycle
    implementation(libs.lifecycle.viewmodel)
    implementation(libs.lifecycle.livedata)

    // Room
    implementation(libs.room.runtime)
    annotationProcessor(libs.room.compiler)
    testImplementation(libs.room.testing)

    // CameraX
    implementation(libs.camera.core)
    implementation(libs.camera.camera2)
    implementation(libs.camera.lifecycle)
    implementation(libs.camera.view)
    implementation(libs.zxing.core)

    // Network & Data
    implementation(libs.gson)
    implementation(libs.guava)
    implementation(libs.okhttp)

    // UI Utils
    implementation(libs.signature.pad)
    implementation(libs.card.form)
    implementation(libs.toasty)

    // Backtrace SDK
    implementation(libs.backtrace)

    // Testing - Unit
    testImplementation(libs.bundles.junit5)
    testRuntimeOnly(libs.junit.jupiter.engine)
    testImplementation(libs.truth)
    testImplementation(libs.allure.junit5)
    testImplementation(libs.bundles.mockito)

    // Testing - AndroidTest
    androidTestImplementation(libs.androidx.test.runner)
    androidTestImplementation(libs.androidx.test.rules)
    androidTestImplementation(libs.truth)
    androidTestImplementation(libs.allure.junit5)
    androidTestRuntimeOnly(libs.junit.jupiter.engine)
    androidTestImplementation(libs.bundles.junit5)
    androidTestImplementation(libs.androidx.arch.core.testing)
    debugImplementation(libs.androidx.fragment.testing)
    androidTestImplementation(libs.bundles.espresso)
}

configurations {
    androidTestImplementation {
        // Exclude log4j as it uses APIs not available on older Android versions (< 26)
        exclude group: 'org.apache.logging.log4j'
    }
}

apply from: "$project.rootDir/gradle/pmd.gradle"
apply from: "$project.rootDir/gradle/checkstyle.gradle"
apply from: "$project.rootDir/gradle/lint.gradle"

allure {
    version = "2.29.0"
}