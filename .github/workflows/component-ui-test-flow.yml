# .github/workflows/component-ui-test-flow.yml
name: Component UI Test Flow

on:
  workflow_call:
    secrets:
      SAUCE_USERNAME:
        required: true
      SAUCE_ACCESS_KEY:
        required: true

jobs:
  run_component_ui_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android Environment
        uses: ./.github/actions/setup-android
        with:
          java-version: '17'

      - name: Cache and Restore Gradle packages
        uses: ./.github/actions/cache-gradle

      - name: Run Component UI Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.tags=component-ui

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-ui-test-reports
          path: |
            app/build/allure-results/
            app/build/reports/androidTests/connected/