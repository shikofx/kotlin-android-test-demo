name: REPORTING

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  publish_reports:
    name: Publish
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Allure Commandline
        run: npm install -g allure-commandline

      - name: Verify artifacts content
        run: |
          ls -R
          
      - name: Structure reports for GitHub Pages
        if: always()
        run: |
          set -e
          mkdir -p pages_root

          # --- Prepare index.html content ---
          cat <<EOF > pages_root/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <title>Static Analysis Reports</title>
            <style>body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; padding: 2em; line-height: 1.5; } h1 { border-bottom: 1px solid #d0d7de; padding-bottom: .3em; } ul { list-style-type: none; padding-left: 0; } li { margin-bottom: 1em; } a { text-decoration: none; color: #0969da; } a:hover { text-decoration: underline; }</style>
          </head>
          <body>
            <h1>Static Analysis Reports</h1>
            <p>Reports generated for the latest build. If a link is broken, the report was not generated.</p>
            <ul>
          EOF

          # --- Process Static Analysis Reports ---
          # Move each report to the pages root and create a link
          if [ -d "artifacts/checkstyle-report" ]; then mv artifacts/checkstyle-report pages_root/checkstyle; echo '<li><a href="checkstyle/debug.html">Checkstyle Report</a></li>' >> pages_root/index.html; fi
          if [ -d "artifacts/pmd-report" ]; then mv artifacts/pmd-report pages_root/pmd; echo '<li><a href="pmd/debug.html">PMD Report</a></li>' >> pages_root/index.html; fi
          if [ -d "artifacts/lint-report" ]; then mv artifacts/lint-report pages_root/lint; echo '<li><a href="lint/lint-results-debug.html">Android Lint Report</a></li>' >> pages_root/index.html; fi

          # --- Process JUnit HTML reports ---
          # Create a main directory for all test reports
          mkdir -p pages_root/test-reports
          echo "<h1>Test Reports</h1><ul>" >> pages_root/index.html
          # Move each test report into the sub-directory and create a link
          if [ -d "artifacts/unit-test-report" ]; then mv artifacts/unit-test-report pages_root/test-reports/unit; echo '<li><a href="test-reports/unit/index.html">Unit Tests</a></li>' >> pages_root/index.html; fi
          if [ -d "artifacts/db-integration-test-report" ]; then mv artifacts/db-integration-test-report pages_root/test-reports/db; echo '<li><a href="test-reports/db/index.html">DB Integration Tests</a></li>' >> pages_root/index.html; fi
          
          # Handle matrix reports for UI tests
          for dir in artifacts/component-ui-test-report-*; do
            if [ -d "$dir" ]; then
              report_name=$(basename "$dir")
              mv "$dir" "pages_root/test-reports/$report_name"
              echo "<li><a href=\"test-reports/$report_name/index.html\">Component UI Tests (${report_name##*-*-})</a></li>" >> pages_root/index.html
            fi
          done
          for dir in artifacts/integration-ui-test-report-*; do
            if [ -d "$dir" ]; then
              report_name=$(basename "$dir")
              mv "$dir" "pages_root/test-reports/$report_name"
              echo "<li><a href=\"test-reports/$report_name/index.html\">Integration UI Tests (${report_name##*-*-})</a></li>" >> pages_root/index.html
            fi
          done

          echo "</ul>" >> pages_root/index.html

          # --- Generate a single Allure report from all results ---
          # Combine all allure results into one directory
          mkdir -p allure-results-combined
          find artifacts -type d -name 'allure-results-unit' -exec cp -r {}/. allure-results-combined/ \;
          find artifacts -type d -name 'allure-results-db' -exec cp -r {}/. allure-results-combined/ \;
          find artifacts -type d -name 'allure-results-component-ui-*' -exec cp -r {}/. allure-results-combined/ \;
          find artifacts -type d -name 'allure-results-integration-ui-*' -exec cp -r {}/. allure-results-combined/ \;
          
          if [ -n "$(ls -A allure-results-combined)" ]; then
            echo "Generating Allure report..."
            allure generate allure-results-combined --clean -o pages_root/allure-report
            echo '<h1>Allure Report</h1><ul><li><a href="allure-report/index.html">View Full Allure Report</a></li></ul>' >> pages_root/index.html
          else
            echo "Allure results not found, skipping report generation."
          fi
          
          # --- Finalize index.html ---
          cat <<EOF >> pages_root/index.html
            </ul>
          </body>
          </html>
          EOF
      
      - name: Verify page_root content
        run: ls -R ./page_root

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'pages_root'

  deploy_report:
    name: Deploy Pages
    runs-on: ubuntu-latest
    if: always()
    needs: [publish_reports]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4