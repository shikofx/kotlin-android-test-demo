name: INTEGRATION-TEST

on:
  workflow_call:

jobs:
  db_integration_tests:
    name: Integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [26] # Достаточно одной версии API для тестов БД
        target: [google_apis]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android Environment
        uses: ./.github/actions/setup-android
        with:
          java-version: '17'

      - name: Restore Gradle cache
        uses: ./.github/actions/cache-gradle

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run DB Integration Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7_pro
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.annotation=by.pda.demoapp.core.annotations.DatabaseTest
            ./gradlew pullAllureResultsFromDevice

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-integration-test-report
          path: |
            app/build/reports/androidTests/connected/
          retention-days: 2

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-db
          path: |
            app/build/allure-results-from-device/allure-results/
          retention-days: 2