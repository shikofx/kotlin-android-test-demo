name: SDET-ANDROID-DEMO CI

on: 
  push:
    branches:
      - '**'
  # pull_request:
  #   branches:
  #     - main
  #     - develop
  # workflow_dispatch:
  #   inputs:
  #     upload_full_build_dir:
  #       description: "Upload full build directory for inspection? (true/false)"
  #       required: true
  #       default: false
  #       type: boolean

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  prepare_dependencies:
    name: Prepare Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android Environment
        uses: ./.github/actions/setup-android
      - name: Cache and Restore Gradle packages
        uses: ./.github/actions/cache-gradle

      - name: Download Dependencies
        run: ./gradlew androidDependencies --no-daemon

  # static_analysis:
  #   name: Static Analysis
  #   needs: [prepare_dependencies]
  #   uses: ./.github/workflows/static-analysis-flow.yml
  #   secrets: inherit

  # unit-tests:
  #   name: Test
  #   needs: [static_analysis]
  #   uses: ./.github/workflows/test-flow.yml
  #   secrets: inherit

  integration_tests:
     name: Test
     needs: [
#       unit-tests,
       prepare_dependencies
     ]
     uses: ./.github/workflows/integration-test-flow.yml
     secrets: inherit

  component_ui_tests:
    name: Test
    needs: [
      # integration_tests,
      prepare_dependencies
    ]
    uses: ./.github/workflows/component-ui-test-flow.yml
    secrets:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

  integration_ui_tests:
    name: Test
    needs: [
      # integration_tests,
      prepare_dependencies
      ]
    uses: ./.github/workflows/integration-ui-test-flow.yml
    secrets:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

  build:
    name: Build
    needs: [
      # integration_tests, 
      component_ui_tests, 
      integration_ui_tests
    ]
    uses: ./.github/workflows/build-apks-flow.yml
    secrets: inherit
    with:
      upload_full_build_dir: ${{ inputs.upload_full_build_dir || false }}

  reporting:
    name: Report
    if: always()
    needs: [
      # static_analysis, 
      # unit-tests, 
      # integration_tests, 
      component_ui_tests, 
      integration_ui_tests, 
      build
    ]
    uses: ./.github/workflows/publish-and-deploy-report-flow.yml
    secrets: inherit  
